[build-system]
requires = ["setuptools>=80.9,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimarket-sentinel"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "apscheduler>=3.11,<4",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "rich>=14,<15",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "typer>=0.21,<1",
]

[project.optional-dependencies]
research = ["tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@a33fd4c0f134485a43553a2c23a63cb14adbd88f"]
brokers = ["alpaca-py>=0.42,<1", "ccxt>=4.4,<5"]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.135,<7",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pip-tools>=7.5,<8",
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.15,<1",
]

[project.scripts]
market-sentinel = "market_sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: uses sandbox or sanitized external fixtures", "e2e: full local pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["market_sentinel"]
